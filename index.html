<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سكانر المستودع</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg: #0E1420;
    --surface: #161D2C;
    --surface-2: #1E2637;
    --border: #2A3245;
    --amber: #E8A33D;
    --amber-dim: #B87F2A;
    --mint: #3DDC97;
    --red: #E8615D;
    --text: #EDEFF3;
    --muted: #8B93A7;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; height:100%; overscroll-behavior:none; }
  h1,h2,h3,.disp{ font-family:'Cairo',sans-serif; }

  .app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:96px; }

  /* Top bar with living-barcode signature mark */
  .topbar{ position:sticky; top:0; z-index:20; background:linear-gradient(180deg, var(--bg) 70%, rgba(14,20,32,0)); padding:18px 18px 10px; display:flex; align-items:center; gap:12px; }
  .mark{ display:flex; align-items:flex-end; gap:2px; height:30px; }
  .mark i{ display:block; width:3px; background:var(--amber); border-radius:1px; animation: barpulse 1.8s ease-in-out infinite; }
  .mark i:nth-child(1){ height:60%; animation-delay:0s; }
  .mark i:nth-child(2){ height:100%; animation-delay:.15s; background:var(--text);}
  .mark i:nth-child(3){ height:40%; animation-delay:.3s; }
  .mark i:nth-child(4){ height:80%; animation-delay:.45s; background:var(--text);}
  .mark i:nth-child(5){ height:55%; animation-delay:.6s; }
  .mark i:nth-child(6){ height:90%; animation-delay:.75s; background:var(--amber);}
  @keyframes barpulse{ 0%,100%{ transform:scaleY(1); opacity:.85 } 50%{ transform:scaleY(.55); opacity:1 } }
  .brand{ flex:1; }
  .brand h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:.2px; }
  .brand p{ margin:0; font-size:11px; color:var(--muted); }
  .gear{ width:38px; height:38px; border-radius:11px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:18px; }

  .content{ padding:4px 18px 0; display:flex; flex-direction:column; gap:14px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .card + .card{ margin-top:0; }
  .card h3{ margin:0 0 12px; font-size:14px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px; }
  .card h3 .n{ width:20px; height:20px; border-radius:6px; background:var(--surface-2); color:var(--text); font-size:11px; display:flex; align-items:center; justify-content:center; font-family:'Cairo'; }

  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=email]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:11px; padding:12px 13px; font-size:14.5px; font-family:'Tajawal'; outline:none;
  }
  input:focus{ border-color:var(--amber); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }

  /* Scan slots */
  .slots{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .slot{ background:var(--surface-2); border:1px dashed var(--border); border-radius:14px; padding:14px 10px; text-align:center; position:relative; }
  .slot.filled{ border-style:solid; border-color:var(--mint); }
  .slot .lbl{ font-size:11px; color:var(--muted); margin-bottom:6px; }
  .slot .val{ font-family:'Cairo'; font-weight:800; font-size:15px; word-break:break-all; min-height:20px; }
  .slot .val.empty{ color:var(--muted); font-weight:500; font-size:12px; font-family:'Tajawal'; }
  .scanbtn{ margin-top:10px; width:100%; border:none; border-radius:10px; padding:9px; font-family:'Cairo'; font-weight:700; font-size:12.5px; background:var(--amber); color:#1a1204; }

  .addbtn{ width:100%; border:none; border-radius:13px; padding:14px; font-family:'Cairo'; font-weight:800; font-size:15px; background:var(--mint); color:#062018; opacity:.4; pointer-events:none; transition:.2s; }
  .addbtn.ready{ opacity:1; pointer-events:auto; }

  /* Entries table */
  .entry{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .entry:last-child{ border-bottom:none; }
  .entry .idx{ font-family:'Cairo'; font-weight:800; color:var(--amber); font-size:13px; width:20px; }
  .entry .info{ flex:1; min-width:0; }
  .entry .codes{ font-family:'Cairo'; font-weight:700; font-size:13px; }
  .entry .meta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .entry .del{ background:none; border:none; color:var(--red); font-size:18px; padding:4px 8px; }
  .empty-state{ text-align:center; padding:22px 10px; color:var(--muted); font-size:13px; }

  /* Bottom action bar */
  .actionbar{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:linear-gradient(0deg, var(--bg) 60%, rgba(14,20,32,0)); padding:14px 18px 18px; }
  .actionbar-inner{ max-width:520px; margin:0 auto; display:flex; gap:10px; }
  .abtn{ flex:1; border:none; border-radius:14px; padding:14px 8px; font-family:'Cairo'; font-weight:800; font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .abtn.csv{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .abtn.send{ background:var(--amber); color:#1a1204; }
  .abtn small{ font-family:'Tajawal'; font-weight:400; font-size:10.5px; opacity:.75; }

  /* Camera modal */
  .modal{ position:fixed; inset:0; background:#000; z-index:100; display:none; flex-direction:column; }
  .modal.open{ display:flex; }
  .modal-top{ padding:16px 18px; display:flex; align-items:center; justify-content:space-between; color:#fff; font-family:'Cairo'; font-weight:700; }
  .modal-top button{ background:rgba(255,255,255,.12); border:none; color:#fff; width:34px; height:34px; border-radius:10px; font-size:16px; }
  #reader{ flex:1; position:relative; }
  #reader video, #reader img, #reader canvas{ object-fit:cover !important; }
  .scan-frame{ position:absolute; inset:0; pointer-events:none; z-index:5; display:flex; align-items:center; justify-content:center; }
  .frame-box{ width:72%; aspect-ratio:1; position:relative; }
  .corner{ position:absolute; width:30px; height:30px; border:3px solid var(--amber); }
  .corner.tl{ top:0; right:0; border-bottom:none; border-left:none; border-radius:8px 0 0 0; }
  .corner.tr{ top:0; left:0; border-bottom:none; border-right:none; border-radius:0 8px 0 0; }
  .corner.bl{ bottom:0; right:0; border-top:none; border-left:none; border-radius:0 0 0 8px; }
  .corner.br{ bottom:0; left:0; border-top:none; border-right:none; border-radius:0 0 8px 0; }
  .laser{ position:absolute; right:4px; left:4px; height:2px; background:var(--amber); box-shadow:0 0 8px var(--amber); animation: sweep 1.7s ease-in-out infinite; }
  @keyframes sweep{ 0%{ top:6%; } 50%{ top:92%; } 100%{ top:6%; } }
  .modal-hint{ color:var(--muted); text-align:center; padding:16px; font-size:13px; }

  /* Toast */
  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:12px; font-size:13px; z-index:200; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Settings sheet */
  .sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90; display:none; }
  .sheet-bg.open{ display:block; }
  .sheet{ position:fixed; left:0; right:0; bottom:-100%; z-index:91; background:var(--surface); border-radius:20px 20px 0 0; padding:20px 18px 26px; max-width:520px; margin:0 auto; transition:bottom .28s ease; border:1px solid var(--border); }
  .sheet.open{ bottom:0; }
  .sheet-handle{ width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px; }
  .sheet h3{ margin:0 0 14px; font-family:'Cairo'; }
  .close-sheet{ width:100%; margin-top:14px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:12px; font-family:'Cairo'; font-weight:700; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="mark"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="brand">
      <h1>سكانر المستودع</h1>
      <p>مسح الرف والصنف · تسجيل فوري</p>
    </div>
    <button class="gear" onclick="openSettings()">⚙</button>
  </div>

  <div class="content">

    <div class="card">
      <h3><span class="n">1</span> بيانات أمر التوريد</h3>
      <div class="field">
        <label>رقم أمر التوريد</label>
        <input type="text" id="orderNo" placeholder="مثال: PO-2026-014">
      </div>
      <div class="field">
        <label>اسم المسؤول</label>
        <input type="text" id="responsible" placeholder="اسم الموظف المسؤول">
      </div>
    </div>

    <div class="card">
      <h3><span class="n">2</span> مسح الأكواد</h3>
      <div class="slots">
        <div class="slot" id="slotShelf">
          <div class="lbl">كود الرف</div>
          <div class="val empty" id="valShelf">لم يُمسح بعد</div>
          <button class="scanbtn" onclick="startScan('shelf')">📷 مسح الرف</button>
        </div>
        <div class="slot" id="slotItem">
          <div class="lbl">كود الصنف</div>
          <div class="val empty" id="valItem">لم يُمسح بعد</div>
          <button class="scanbtn" onclick="startScan('item')">📷 مسح الصنف</button>
        </div>
      </div>
      <button class="addbtn" id="addBtn" onclick="addEntry()" style="margin-top:14px;">➕ إضافة السطر</button>
    </div>

    <div class="card">
      <h3><span class="n">3</span> السجلات المسجّلة (<span id="countLbl">0</span>)</h3>
      <div id="entriesList">
        <div class="empty-state">لسه مفيش أي أصناف متسجلة في أمر التوريد ده</div>
      </div>
    </div>

  </div>
</div>

<div class="actionbar">
  <div class="actionbar-inner">
    <button class="abtn csv" onclick="exportCSV()">📊 تصدير Excel<small>ملف CSV</small></button>
    <button class="abtn send" onclick="sendEmail()">📧 إرسال بالبريد<small>مشاركة الملف</small></button>
  </div>
</div>

<!-- Camera modal -->
<div class="modal" id="cameraModal">
  <div class="modal-top">
    <span id="scanTitle">مسح كود الرف</span>
    <button onclick="stopScan()">✕</button>
  </div>
  <div id="reader"></div>
  <div class="scan-frame">
    <div class="frame-box">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="laser"></div>
    </div>
  </div>
  <div class="modal-hint">وجّه الكاميرا نحو الباركود أو كود QR</div>
</div>

<!-- Settings sheet -->
<div class="sheet-bg" id="sheetBg" onclick="closeSettings()"></div>
<div class="sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <h3>إعدادات الإرسال</h3>
  <div class="field">
    <label>البريد الإلكتروني للإرسال إليه</label>
    <input type="email" id="targetEmail" placeholder="example@company.com">
  </div>
  <button class="close-sheet" onclick="closeSettings()">حفظ وإغلاق</button>
</div>

<div class="toast" id="toast"></div>

<script>
let entries = [];
let scanTarget = null;
let html5QrCode = null;
let currentShelf = '';
let currentItem = '';
let targetEmail = '';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function openSettings(){
  document.getElementById('targetEmail').value = targetEmail;
  document.getElementById('sheetBg').classList.add('open');
  document.getElementById('settingsSheet').classList.add('open');
}
function closeSettings(){
  targetEmail = document.getElementById('targetEmail').value.trim();
  document.getElementById('sheetBg').classList.remove('open');
  document.getElementById('settingsSheet').classList.remove('open');
}

function startScan(target){
  scanTarget = target;
  document.getElementById('scanTitle').textContent = target === 'shelf' ? 'مسح كود الرف' : 'مسح كود الصنف';
  document.getElementById('cameraModal').classList.add('open');
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 12, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };
  html5QrCode.start(
    { facingMode: "environment" },
    config,
    (decodedText) => { onScanSuccess(decodedText); },
    (err) => { /* ignore per-frame no-match */ }
  ).catch((err)=>{
    toast('تعذّر تشغيل الكاميرا — تأكد من صلاحية الوصول');
    stopScan();
  });
}

function onScanSuccess(text){
  if (scanTarget === 'shelf'){
    currentShelf = text;
    document.getElementById('valShelf').textContent = text;
    document.getElementById('valShelf').classList.remove('empty');
    document.getElementById('slotShelf').classList.add('filled');
  } else {
    currentItem = text;
    document.getElementById('valItem').textContent = text;
    document.getElementById('valItem').classList.remove('empty');
    document.getElementById('slotItem').classList.add('filled');
  }
  if (navigator.vibrate) navigator.vibrate(80);
  stopScan();
  updateAddBtn();
}

function stopScan(){
  document.getElementById('cameraModal').classList.remove('open');
  if (html5QrCode){
    html5QrCode.stop().then(()=>{ html5QrCode.clear(); }).catch(()=>{});
  }
}

function updateAddBtn(){
  const btn = document.getElementById('addBtn');
  if (currentShelf && currentItem) btn.classList.add('ready');
  else btn.classList.remove('ready');
}

function addEntry(){
  const orderNo = document.getElementById('orderNo').value.trim();
  const responsible = document.getElementById('responsible').value.trim();
  if (!orderNo || !responsible){
    toast('من فضلك أدخل رقم أمر التوريد واسم المسؤول أولاً');
    return;
  }
  if (!currentShelf || !currentItem) return;

  const now = new Date();
  const date = now.toLocaleDateString('en-GB');
  const time = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

  entries.push({ orderNo, shelf: currentShelf, item: currentItem, responsible, date, time });

  currentShelf = ''; currentItem = '';
  document.getElementById('valShelf').textContent = 'لم يُمسح بعد';
  document.getElementById('valShelf').classList.add('empty');
  document.getElementById('slotShelf').classList.remove('filled');
  document.getElementById('valItem').textContent = 'لم يُمسح بعد';
  document.getElementById('valItem').classList.add('empty');
  document.getElementById('slotItem').classList.remove('filled');
  updateAddBtn();

  renderEntries();
  toast('تم إضافة الصنف ✓');
}

function renderEntries(){
  document.getElementById('countLbl').textContent = entries.length;
  const list = document.getElementById('entriesList');
  if (entries.length === 0){
    list.innerHTML = '<div class="empty-state">لسه مفيش أي أصناف متسجلة في أمر التوريد ده</div>';
    return;
  }
  list.innerHTML = entries.map((e, i) => `
    <div class="entry">
      <div class="idx">${i+1}</div>
      <div class="info">
        <div class="codes">رف: ${escapeHtml(e.shelf)} · صنف: ${escapeHtml(e.item)}</div>
        <div class="meta">${e.date} · ${e.time} · ${escapeHtml(e.responsible)}</div>
      </div>
      <button class="del" onclick="deleteEntry(${i})">🗑</button>
    </div>
  `).join('');
}

function deleteEntry(i){
  entries.splice(i, 1);
  renderEntries();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildCSV(){
  const header = ['رقم أمر التوريد','كود الرف','كود الصنف','اسم المسؤول','التاريخ','التوقيت'];
  const rows = entries.map(e => [e.orderNo, e.shelf, e.item, e.responsible, e.date, e.time]);
  const all = [header, ...rows];
  const csv = all.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  return '\uFEFF' + csv; // BOM for Excel Arabic support
}

function getFileName(){
  const orderNo = document.getElementById('orderNo').value.trim() || 'بدون_رقم';
  return `أمر_توريد_${orderNo}.csv`;
}

function exportCSV(){
  if (entries.length === 0){ toast('لا يوجد بيانات لتصديرها بعد'); return; }
  const csv = buildCSV();
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = getFileName();
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('تم تصدير الملف ✓');
}

async function sendEmail(){
  if (entries.length === 0){ toast('لا يوجد بيانات لإرسالها بعد'); return; }
  if (!targetEmail){ openSettings(); toast('حدد البريد الإلكتروني أولاً من الإعدادات ⚙'); return; }

  const orderNo = document.getElementById('orderNo').value.trim() || '—';
  const csv = buildCSV();
  const fileName = getFileName();
  const file = new File([csv], fileName, { type: 'text/csv' });

  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({
        files: [file],
        title: `أمر توريد ${orderNo}`,
        text: `مرفق سجل أمر التوريد رقم ${orderNo} — الرجاء الإرسال إلى: ${targetEmail}`
      });
      toast('اختر تطبيق البريد من القائمة ✓');
      return;
    }catch(e){ /* user cancelled or unsupported, fall back below */ }
  }

  // Fallback: mailto with summary in body (no attachment support)
  const subject = encodeURIComponent(`سجل أمر توريد رقم ${orderNo}`);
  let body = `سجل أمر التوريد رقم: ${orderNo}\n\n`;
  entries.forEach((e,i)=>{ body += `${i+1}. رف: ${e.shelf} — صنف: ${e.item} — ${e.date} ${e.time} — ${e.responsible}\n`; });
  window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${encodeURIComponent(body)}`;
}
</script>
</body>
</html>
